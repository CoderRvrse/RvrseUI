name: simple-ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          version: v0.3.0

      # The anti-drift gate. MUST RUN BEFORE "Format Code".
      #
      # stylua REWRITES src/ in place. Rebuilding after it compares the
      # committed monolith against sources CI itself just reformatted, so
      # the diff is enormous and meaningless -- 613 KB against a committed
      # 568 KB on the first run of this gate. The check only means anything
      # against the sources as they were committed.
      #
      # The docs site sat at v4.6.0 and "491 KB" for four releases, this file
      # said v4.3.19 for seven, and the library's own header announced v4.5.2
      # -- all because each was a number typed by hand with nothing to notice
      # when it went stale. They are generated now, and this step fails if a
      # pull request did not regenerate them.
      #
      # It only works because the build is reproducible: the header used to
      # carry a wall-clock timestamp, so every build "changed" the file and a
      # diff could never mean anything.
      - name: Docs and monolith match their sources
        run: |
          node tools/build.js
          if ! git diff --exit-code -- RvrseUI.lua docs/index.html README.md; then
            echo "::error::Rebuilding changed tracked files. Run 'node tools/build.js' and commit the result."
            exit 1
          fi
          echo "✅ RvrseUI.lua, the docs site and the README all match src/ and VERSION.json"

      - name: Format Code
        run: |
          echo "Formatting Lua code with Stylua..."
          stylua src/ init.lua tools/ examples/

      - name: Verify Rojo Build
        run: |
          echo "Building Roblox place with Rojo..."
          mkdir -p build
          rojo build default.project.json --output build/RvrseUI.rbxlx

      - name: Success
        run: |
          VERSION=$(node -p "require('./VERSION.json').version.full")
          echo "✅ RvrseUI build successful!"
          echo "📦 Version: v$VERSION"
          echo "📊 Size: $(du -h build/RvrseUI.rbxlx | cut -f1)"
